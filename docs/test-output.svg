  <circle cx="28" cy="26" r="7" fill="#ff5f56"/>
  <circle cx="52" cy="26" r="7" fill="#ffbd2e"/>
  <circle cx="76" cy="26" r="7" fill="#27c93f"/>
  <g fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="21">
    <text x="30" y="92">$ npm test</text>
